user nginx;
worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # =========================================================================
    # UPSTREAM - Configuración de backend servers (réplicas del API)
    # =========================================================================
    upstream api_backend {
        # Algoritmo de balanceo: round-robin con health checks
        least_conn;  # Distribución por conexiones activas (mejor para requests variados)
        
        # 5 réplicas del API service
        # En docker-compose, los nombres de contenedor se resuelven automáticamente
        server pdf-api-1:8080 max_fails=3 fail_timeout=30s;
        server pdf-api-2:8080 max_fails=3 fail_timeout=30s;
        server pdf-api-3:8080 max_fails=3 fail_timeout=30s;
        server pdf-api-4:8080 max_fails=3 fail_timeout=30s;
        server pdf-api-5:8080 max_fails=3 fail_timeout=30s;
        
        # Keepalive para conexiones persistentes upstream
        keepalive 32;
    }

    # =========================================================================
    # SERVIDOR PRINCIPAL - Reverse Proxy
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # =====================================================================
        # TIMEOUTS - Ajustados para benchmark
        # =====================================================================
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;

        # =====================================================================
        # HEADERS - Propagación de información de cliente
        # =====================================================================
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # =====================================================================
        # HEALTH CHECK - Endpoint de verificación del balanceador
        # =====================================================================
        location /lb-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # =====================================================================
        # HEALTH - Propagar al backend
        # =====================================================================
        location /health {
            proxy_pass http://api_backend;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            access_log off;
        }

        # =====================================================================
        # METRICS - Propagar al backend
        # =====================================================================
        location /metrics {
            proxy_pass http://api_backend;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # =====================================================================
        # API ROUTES - Rutas de la aplicación
        # =====================================================================
        location /api/ {
            proxy_pass http://api_backend;
        }

        # =====================================================================
        # DEFAULT - Capturar todas las demás rutas
        # =====================================================================
        location / {
            proxy_pass http://api_backend;
        }

        # =====================================================================
        # ERROR HANDLING
        # =====================================================================
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}