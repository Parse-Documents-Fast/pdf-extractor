services:
  pdf-extractor:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis-queue:6379/0
      - REDIS_STREAM_INPUT=queue:extraction
      - REDIS_STREAM_OUTPUT=queue:extraction-results
      - REDIS_STREAM_DLQ=queue:extraction-dlq
      - REDIS_CONSUMER_GROUP=pdf-extractor-group
      - CONSUMER_NAME=pdf-extractor-1
      - HTTP_ADDR=:8000
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - fast_pdf_network

networks:
  fast_pdf_network:
    external: true
