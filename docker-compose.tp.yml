services:
  pdf-extractor:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    environment:
      - REDIS_URL=redis://redis-queue:6379/0
      - REDIS_STREAM_INPUT=queue:extraction
      - REDIS_STREAM_OUTPUT=queue:extraction-results
      - REDIS_STREAM_DLQ=queue:extraction-dlq
      - REDIS_CONSUMER_GROUP=pdf-extractor-group
      - CONSUMER_NAME=pdf-extractor-tp
      - HTTP_ADDR=:8080
      - LOG_LEVEL=warn
      - GOMAXPROCS=1
      - WORKER_COUNT=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - fast_pdf_network

networks:
  fast_pdf_network:
    external: true
