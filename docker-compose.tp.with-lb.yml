version: '3.8'

# Docker Compose para Evaluación del TP con Load Balancer (nginx)
# 
# Este archivo escala el API a 5 réplicas con balanceador de carga.
# 
# Comando:
#   docker compose -f docker-compose.tp.with-lb.yml up --build
# 
# Acceder a:
#   - API via LB: http://localhost:80 (o simplemente http://localhost)
#   - API directo: http://localhost:8081, :8082, :8083, :8084, :8085
#   - Salud del LB: http://localhost/lb-health
#   - Salud API: http://localhost/health

services:
  # =============================================================================
  # LOAD BALANCER - nginx (Distribuidor de Carga)
  # =============================================================================
  lb:
    image: nginx:1.25-alpine
    container_name: pdf-lb
    ports:
      - "80:80"  # Puerto para acceso público
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
      - api-4
      - api-5
    restart: unless-stopped
    networks:
      - pdf-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # =============================================================================
  # API - Réplica 1
  # =============================================================================
  api-1:
    build:
      context: ./pdf-extractor-main
      dockerfile: Dockerfile
    container_name: pdf-api-1
    ports:
      - "8081:8080"
    environment:
      - HTTP_ADDR=:8080
      - LOG_LEVEL=warn
      - REDIS_URI=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=pdf-extractor
      - MONGO_COLLECTION=documents
      - GOMAXPROCS=1
      - GOMEMLIMIT=256MiB
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - pdf-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # =============================================================================
  # API - Réplica 2
  # =============================================================================
  api-2:
    build:
      context: ./pdf-extractor-main
      dockerfile: Dockerfile
    container_name: pdf-api-2
    ports:
      - "8082:8080"
    environment:
      - HTTP_ADDR=:8080
      - LOG_LEVEL=warn
      - REDIS_URI=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=pdf-extractor
      - MONGO_COLLECTION=documents
      - GOMAXPROCS=1
      - GOMEMLIMIT=256MiB
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - pdf-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # =============================================================================
  # API - Réplica 3
  # =============================================================================
  api-3:
    build:
      context: ./pdf-extractor-main
      dockerfile: Dockerfile
    container_name: pdf-api-3
    ports:
      - "8083:8080"
    environment:
      - HTTP_ADDR=:8080
      - LOG_LEVEL=warn
      - REDIS_URI=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=pdf-extractor
      - MONGO_COLLECTION=documents
      - GOMAXPROCS=1
      - GOMEMLIMIT=256MiB
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - pdf-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # =============================================================================
  # API - Réplica 4
  # =============================================================================
  api-4:
    build:
      context: ./pdf-extractor-main
      dockerfile: Dockerfile
    container_name: pdf-api-4
    ports:
      - "8084:8080"
    environment:
      - HTTP_ADDR=:8080
      - LOG_LEVEL=warn
      - REDIS_URI=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=pdf-extractor
      - MONGO_COLLECTION=documents
      - GOMAXPROCS=1
      - GOMEMLIMIT=256MiB
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - pdf-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # =============================================================================
  # API - Réplica 5
  # =============================================================================
  api-5:
    build:
      context: ./pdf-extractor-main
      dockerfile: Dockerfile
    container_name: pdf-api-5
    ports:
      - "8085:8080"
    environment:
      - HTTP_ADDR=:8080
      - LOG_LEVEL=warn
      - REDIS_URI=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=pdf-extractor
      - MONGO_COLLECTION=documents
      - GOMAXPROCS=1
      - GOMEMLIMIT=256MiB
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - pdf-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # =============================================================================
  # REDIS - Cache/Queue Backend
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: pdf-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256m --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - pdf-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # =============================================================================
  # MONGODB - Base de Datos Persistente
  # =============================================================================
  mongo:
    image: mongo:7
    container_name: pdf-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    command: >
      --wdtimeout=5000
      --syncdelay=60
      --maxConns=100
      --wiredTigerCacheSizeGB=0.25
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - pdf-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # =============================================================================
  # BENCHMARK - Script de Pruebas de Carga (k6)
  # =============================================================================
  benchmark:
    image: grafana/k6:latest
    container_name: pdf-benchmark
    volumes:
      - ./pdf-extractor-main/docs/benchmark.js:/scripts/benchmark.js:ro
    environment:
      # Spike test: 10 VUs durante 30s
      - K6_VUS=10
      - K6_DURATION=30s
    command: run /scripts/benchmark.js
    depends_on:
      lb:
        condition: service_started
    restart: "no"
    networks:
      - pdf-network

networks:
  pdf-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16